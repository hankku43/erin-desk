<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline';">
<title>筆記本・委託</title>
<link rel="stylesheet" href="../../assets/fonts/iansui/iansui.css">
<link rel="stylesheet" href="plandraft.css">
</head>
<body>
  <div id="book" data-book="quests">
    <header id="bar">
      <div class="ttl"><span class="book" id="ttlIco">📓</span><b id="ttl">筆記本</b><span class="sub" id="ttlSub">委託簿</span></div>
      <div class="weeks" id="weeks" role="tablist"></div>
      <span class="grow"></span>
      <span id="changes" class="changes hidden"></span>
      <button class="tb" id="bUndo" data-tip="復原上一個修改（Ctrl+Z）">↶ 復原</button>
      <div class="more"><button class="tb" id="bMore" aria-label="更多" data-tip="整頁擦掉、放棄修改">⋯</button>
        <div class="menu hidden" id="moreMenu">
          <button data-wipe>🧽 整頁擦掉重寫（原本的全部標成刪掉）</button>
          <button data-discard>↺ 放棄這一頁還沒寫進去的修改</button>
          <button data-font>✍ 手寫字型：<span id="fontState">開</span></button>
        </div>
      </div>
      <button class="tb gold" id="bCommit">✔ 寫進計畫檔</button>
      <button class="tb x" id="bClose" aria-label="收起來" data-tip="收起筆記本（修改會留著，下次接著寫）">✕</button>
    </header>
    <div id="confirm" class="confirm hidden"></div>
    <!-- ⏰ 艾琳的提醒、📯 團戰倒數：主視窗藏著的時候也看得到 -->
    <div id="notice" class="notice hidden" role="status"><span id="noticeFocus" class="nf hidden"></span><span id="noticeText" class="nt"></span><span class="grow"></span><button class="nx hidden" id="noticeClose" aria-label="知道了" data-tip="知道了">✕</button></div>
    <div id="warns" class="warns hidden"></div>
    <div id="unsureBox" class="unsure-strip hidden"><b class="uh">❓ 不確定</b><div id="unsure" class="uns-list"></div></div>
    <main id="main">
      <!-- 📜 委託簿：依截止日分欄 -->
      <section id="pageQuests" class="page">
        <div class="ph">
          <h2><span>📜 委託簿</span><i class="info" data-tip="依截止日排。委託＝櫃台週任務板上的任務、步驟＝任務卡上的目標（同一件事寫在計畫檔裡的樣子）。勾步驟、交付＝立刻寫進計畫檔；新加、改、刪＝鉛筆草稿，按「寫進計畫檔」才算。滑過便利貼按「🕘 排進時刻簿」可以把步驟拆成一格一格的時段">ⓘ</i></h2>
          <span class="grow"></span>
          <button class="add" data-add="quest">＋ 委託</button>
        </div>
        <div id="dueCols" class="duecols"></div>
      </section>
      <!-- 🕘 時刻簿：一天一頁（可以切一週總覽） -->
      <section id="pageTime" class="page hidden">
        <div class="ph">
          <h2><span>🕘 時刻簿</span><i class="info" data-tip="一天一頁。方塊拖著換時間、拉下緣改長短、拖到上面的日子分頁搬到那天；右邊的委託拖進來排一格；點空白處加一格。勾一格＝立刻寫進計畫檔；加、改、搬＝鉛筆草稿，按「寫進計畫檔」才算">ⓘ</i></h2>
          <div id="dayTabs" class="daytabs" role="tablist"></div>
          <button class="tb small" id="bWeekView" data-tip="五天並排看一週">📅 一週總覽</button>
          <span class="grow"></span>
          <label class="unit" data-tip="點空白加一格、拖拉時，時間對齊到這個單位">對齊：<select id="unitSel"><option value="60">每 1 小時</option><option value="30" selected>每 30 分</option><option value="15">每 15 分</option></select></label>
        </div>
        <div id="timeArea" class="time-area"></div>
      </section>
    </main>
    <footer id="foot">
      <div class="portrait"><img id="face" alt="" draggable="false"></div>
      <div class="talk">
        <div class="bubble"><div id="say"></div></div>
        <div id="log" class="log"></div>
        <form id="sayForm" autocomplete="off">
          <input id="sayInput" maxlength="600" placeholder="跟艾琳說要加什麼、改什麼…">
          <button class="tb gold" id="sayBtn" type="submit">說</button>
        </form>
      </div>
    </footer>
  </div>
  <!-- 右邊的兩張索引書籤 -->
  <nav id="tabs" class="bookmarks" role="tablist" aria-label="翻到哪一本">
    <button role="tab" data-book="quests" class="bm bm-q"><i>📜</i><span>委託</span><em class="bump hidden"></em></button>
    <button role="tab" data-book="time" class="bm bm-t"><i>🕘</i><span>時刻</span><em class="bump hidden"></em></button>
  </nav>
  <div id="intro" class="intro hidden"><img id="intro1" alt=""><img id="intro2" alt=""></div>
  <div id="stamp" class="stamp hidden"><img id="stampErin" alt=""><img id="stampSeal" alt=""></div>
  <div id="pop" class="pop hidden" role="dialog" aria-modal="true"></div>
  <div id="fx"></div>
  <div id="tip" class="tip hidden"></div>
  <script src="plandraft.js"></script>
</body>
</html>
