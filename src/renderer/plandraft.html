<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; style-src 'self' 'unsafe-inline';">
<title>筆記本・委託</title>
<link rel="stylesheet" href="plandraft.css">
</head>
<body>
  <div id="book">
    <header id="bar">
      <div class="ttl"><span class="book">📓</span><b id="ttl">筆記本</b><span class="sub">委託</span></div>
      <div class="weeks" id="weeks" role="tablist"></div>
      <div id="sum" class="sum"></div>
      <span class="grow"></span>
      <span id="changes" class="changes hidden"></span>
      <button class="tb" id="bUndo" data-tip="復原上一個修改（Ctrl+Z）">↶ 復原</button>
      <div class="more"><button class="tb" id="bMore" aria-label="更多" data-tip="整頁擦掉、放棄修改">⋯</button>
        <div class="menu hidden" id="moreMenu">
          <button data-wipe>🧽 整頁擦掉重寫（原本的全部標成刪掉）</button>
          <button data-discard>↺ 放棄這一頁還沒寫進去的修改</button>
        </div>
      </div>
      <button class="tb gold" id="bCommit">✔ 寫進計畫檔</button>
      <button class="tb x" id="bClose" aria-label="收起來" data-tip="收起筆記本（修改會留著，下次接著寫）">✕</button>
    </header>
    <div id="confirm" class="confirm hidden"></div>
    <div id="warns" class="warns hidden"></div>
    <main id="main">
      <aside id="left">
        <section>
          <h2><span>📜 委託</span><button class="add" data-add="quest">＋ 委託</button></h2>
          <div id="quests"></div>
        </section>
        <section class="col-unsure hidden" id="unsureBox">
          <h2><span>❓ 不確定</span></h2>
          <div id="unsure"></div>
        </section>
      </aside>
      <section id="week"><div id="days" class="days"></div></section>
    </main>
    <footer id="foot">
      <div class="portrait"><img id="face" alt="" draggable="false"></div>
      <div class="talk">
        <div class="bubble"><div id="say"></div></div>
        <div id="log" class="log"></div>
        <form id="sayForm" autocomplete="off">
          <input id="sayInput" maxlength="600" placeholder="跟艾琳說要加什麼、改什麼…">
          <button class="tb gold" id="sayBtn" type="submit">說</button>
        </form>
      </div>
    </footer>
  </div>
  <div id="intro" class="intro hidden"><img id="intro1" alt=""><img id="intro2" alt=""></div>
  <div id="stamp" class="stamp hidden"><img id="stampErin" alt=""><img id="stampSeal" alt=""></div>
  <div id="pop" class="pop hidden" role="dialog" aria-modal="true"></div>
  <div id="fx"></div>
  <div id="tip" class="tip hidden"></div>
  <script src="plandraft.js"></script>
</body>
</html>
